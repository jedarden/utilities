# ~/.config/bao-as/instances.conf
# One whitespace-delimited row per instance:
# <instance-name>  <BAO_ADDR>
#
# Replace both placeholders below. The address is the complete endpoint URL;
# credentials are not stored in this file. For an instance named <instance-name>
# they live at ~/.config/bao-as/<instance-name>/{role_id,secret_id}, mode 0600.
<instance-name>  https://<openbao-host>:8200
